name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Install SIMSOPT for the cross-check (optional)
        run: pip install simsopt || echo "SIMSOPT not available; its tests will be skipped"

      - name: Fetch public W7-X reference files
        run: python scripts/fetch_w7x_data.py

      - name: Test
        run: pytest -ra
